<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lazada Indonesia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style-register.css">
</head>
<body>
    <div class="modal-card">
        <!-- Tombol Tutup -->
        <button type="button" class="close-btn" aria-label="Close" onclick="window.location.href='index.html'">&times;</button>

        <!-- Judul Modal -->
        <h2 class="modal-title">Log in</h2>

        <!-- Tab Switcher -->
        <div class="login-tabs">
            <button type="button" class="login-tab-btn active" id="tabPasswordBtn" onclick="showTab('password')">Password</button>
            <button type="button" class="login-tab-btn" id="tabPhoneBtn" onclick="showTab('phone')">Nomor HP</button>
        </div>

        <!-- Form Tab 1: Password / Email -->
        <div id="passwordForm">
            <div class="form-group">
                <input type="text" class="form-input" id="loginUsername" placeholder="Nomor Telepon atau Email">
            </div>
            <div class="form-group">
                <input type="password" class="form-input" id="loginPassword" placeholder="Kata Sandi">
            </div>
            <a href="#" class="forgot-password-link">Lupa Kata Sandi?</a>

            <button type="button" class="btn btn-login" onclick="window.location.href='index.html'">
                <span>LOG IN</span>
            </button>
        </div>

        <!-- Form Tab 2: Phone Number OTP -->
        <div id="phoneForm" style="display: none;">
            <div class="phone-input-group">
                <div class="country-code">
                    <sub>ID</sub>+62
                </div>
                <input type="tel" class="phone-input" placeholder="Masukkan nomor telepon Anda">
            </div>

            <button type="button" class="btn btn-whatsapp" onclick="window.location.href='index.html'">
                <i class="fa-brands fa-whatsapp btn-icon"></i>
                <span>Masuk via Whatsapp</span>
            </button>

            <button type="button" class="btn btn-sms" onclick="window.location.href='index.html'">
                <i class="fa-solid fa-mobile-screen-button btn-icon"></i>
                <span>Masuk via SMS</span>
            </button>
        </div>

        <!-- Link ke Register -->
        <p class="login-prompt">
            Belum punya akun? <a href="register.html">Daftar Sekarang</a>
        </p>

        <!-- Divider -->
        <div class="divider-text">Atau masuk dengan</div>

        <!-- Social Login -->
        <div class="social-login">
            <button type="button" class="btn-social" onclick="window.location.href='index.html'">
                <svg class="social-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Google
            </button>

            <button type="button" class="btn-social" onclick="window.location.href='index.html'">
                <svg class="social-icon" viewBox="0 0 24 24" fill="#1877F2">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
                Facebook
            </button>
        </div>
    </div>

    <script>
        function showTab(tab) {
            const passBtn = document.getElementById('tabPasswordBtn');
            const phoneBtn = document.getElementById('tabPhoneBtn');
            const passForm = document.getElementById('passwordForm');
            const phoneForm = document.getElementById('phoneForm');

            if (tab === 'password') {
                passBtn.classList.add('active');
                phoneBtn.classList.remove('active');
                passForm.style.display = 'block';
                phoneForm.style.display = 'none';
            } else {
                phoneBtn.classList.add('active');
                passBtn.classList.remove('active');
                phoneForm.style.display = 'block';
                passForm.style.display = 'none';
            }
        }
    </script>
</body>
</html>
